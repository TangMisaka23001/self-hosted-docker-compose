services:
  dsh:
    image: smanx/deepseek-harness:devtools-min-0.2.2-rc.1
    container_name: dsh
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - PROXY_USERNAME=${PROXY_USERNAME}
      - PROXY_PASSWORD=${PROXY_PASSWORD}
    volumes:
      - /root/workspace/dsh_data:/root/.dsh
      - /root/workspace:/workspace
    labels:
      - traefik.enable=true
      - traefik.http.routers.dsh.rule=Host(`dsh.misakatang.xyz`)
      - traefik.http.routers.dsh.entrypoints=websecure
      - traefik.http.routers.dsh.tls.certresolver=leresolver
      - traefik.http.routers.dsh.service=dsh
      - traefik.http.services.dsh.loadbalancer.server.port=3080
    networks:
      - traefik-public
networks:
  traefik-public:
    external: true
